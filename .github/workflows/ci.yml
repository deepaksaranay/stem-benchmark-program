name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8

      - name: Unit tests
        run: pytest -q

      - name: Every task has two agreeing solutions
        run: python -m benchmark validate-tasks

      - name: Answer key is up to date
        run: python -m benchmark build-key --check

      - name: Build the delivery report
        run: python -m benchmark report

      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: delivery-report
          path: reports/delivery_report.md
